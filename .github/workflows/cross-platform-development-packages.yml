name: Cross-platform development packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-development-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.1
  RUST_BASELINE_VERSION: 1.97.1
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  quality:
    name: Offline quality gate
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust baseline
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_BASELINE_VERSION }}
          components: rustfmt, clippy

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Report toolchains
        run: |
          flutter --version
          rustc --version
          cargo --version

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --locked --workspace --all-targets

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: apps/flutter
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze Flutter application
        working-directory: apps/flutter
        run: dart analyze

      - name: Test Flutter application
        working-directory: apps/flutter
        run: flutter test

  android:
    name: Android development APKs
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust for Cargokit
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Build ARM64 development APK
        working-directory: apps/flutter
        run: flutter build apk --release --target-platform android-arm64

      - name: Collect ARM64 APK
        working-directory: apps/flutter
        run: |
          mkdir -p build/test-packages
          cp build/app/outputs/flutter-apk/app-release.apk build/test-packages/flutterustmusic-android-arm64-development.apk

      - name: Build x64 emulator APK
        working-directory: apps/flutter
        run: flutter build apk --debug --target-platform android-x64

      - name: Collect Android artifacts
        working-directory: apps/flutter
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk build/test-packages/flutterustmusic-android-x64-debug.apk
          cp ../../docs/development/cross-platform-test-packages.md build/test-packages/README.md
          flutter --version > build/test-packages/FLUTTER_VERSION.txt
          rustc --version > build/test-packages/RUST_VERSION.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-android-development-${{ github.run_number }}
          path: apps/flutter/build/test-packages/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  linux:
    name: Linux x64 development bundle
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good dbus-x11 xvfb

      - name: Install Rust baseline
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_BASELINE_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Verify Linux MPRIS session-bus contract
        working-directory: apps/flutter
        run: dbus-run-session -- xvfb-run -a flutter test integration_test/system_playback_service_test.dart -d linux

      - name: Build Linux Release bundle
        working-directory: apps/flutter
        run: flutter build linux --release

      - name: Package Linux bundle
        working-directory: apps/flutter
        run: |
          mkdir -p build/test-packages
          tar -C build/linux/x64/release -czf build/test-packages/flutterustmusic-linux-x64-development.tar.gz bundle
          cp ../../docs/development/cross-platform-test-packages.md build/test-packages/README.md
          ldd build/linux/x64/release/bundle/flutterustmusic > build/test-packages/LINUX_RUNTIME_DEPENDENCIES.txt
          flutter --version > build/test-packages/FLUTTER_VERSION.txt
          rustc --version > build/test-packages/RUST_VERSION.txt

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-linux-x64-development-${{ github.run_number }}
          path: apps/flutter/build/test-packages/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  windows:
    name: Windows x64 development bundle
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust for Cargokit
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Build Windows Release bundle
        working-directory: apps/flutter
        run: flutter build windows --release

      - name: Package Windows bundle
        working-directory: apps/flutter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/test-packages | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/test-packages/flutterustmusic-windows-x64-development.zip
          Copy-Item ../../docs/development/cross-platform-test-packages.md build/test-packages/README.md
          flutter --version | Out-File -Encoding utf8 build/test-packages/FLUTTER_VERSION.txt
          rustc --version | Out-File -Encoding utf8 build/test-packages/RUST_VERSION.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-windows-x64-development-${{ github.run_number }}
          path: apps/flutter/build/test-packages/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  macos:
    name: macOS development app
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust for Cargokit
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Build macOS Release app
        working-directory: apps/flutter
        run: flutter build macos --release

      - name: Package macOS app
        working-directory: apps/flutter
        run: |
          mkdir -p build/test-packages
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/flutterustmusic.app build/test-packages/flutterustmusic-macos-development.zip
          cp ../../docs/development/cross-platform-test-packages.md build/test-packages/README.md
          lipo -archs build/macos/Build/Products/Release/flutterustmusic.app/Contents/MacOS/flutterustmusic > build/test-packages/MACOS_ARCHITECTURES.txt
          flutter --version > build/test-packages/FLUTTER_VERSION.txt
          rustc --version > build/test-packages/RUST_VERSION.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-macos-development-${{ github.run_number }}
          path: apps/flutter/build/test-packages/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  ios-simulator:
    name: iOS Simulator Debug app
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust for Cargokit
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Build iOS Simulator app
        working-directory: apps/flutter
        run: flutter build ios --simulator --debug

      - name: Package iOS Simulator app
        working-directory: apps/flutter
        run: |
          mkdir -p build/test-packages
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/test-packages/flutterustmusic-ios-simulator-development.zip
          cp ../../docs/development/cross-platform-test-packages.md build/test-packages/README.md
          lipo -archs build/ios/iphonesimulator/Runner.app/Runner > build/test-packages/IOS_SIMULATOR_ARCHITECTURES.txt
          flutter --version > build/test-packages/FLUTTER_VERSION.txt
          rustc --version > build/test-packages/RUST_VERSION.txt

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-ios-simulator-development-${{ github.run_number }}
          path: apps/flutter/build/test-packages/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
