name: Cross-platform development packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-development-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.1
  RUST_BASELINE_VERSION: 1.97.1
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  quality:
    name: Offline quality gate
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust baseline
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_BASELINE_VERSION }}
          components: rustfmt, clippy

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Report toolchains
        run: |
          flutter --version
          rustc --version
          cargo --version

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --locked --workspace --all-targets

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: apps/flutter
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze Flutter application
        working-directory: apps/flutter
        run: dart analyze

      - name: Test Flutter application
        working-directory: apps/flutter
        run: flutter test

  android:
    name: Android development APKs
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust for Cargokit
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Build ARM64 development APK
        working-directory: apps/flutter
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify ARM64 networking and Rust payload
        working-directory: apps/flutter
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$aapt"
          "$aapt" dump permissions "$apk" | tee build/android-arm64-permissions.txt
          grep -q "android.permission.INTERNET" build/android-arm64-permissions.txt
          "$aapt" dump xmltree "$apk" AndroidManifest.xml \
            > build/android-arm64-manifest.txt
          grep -q 'dev.axiaobo.flutterustmusic.FuraApplication' \
            build/android-arm64-manifest.txt
          unzip -l "$apk" | tee build/android-arm64-contents.txt
          grep -q "lib/arm64-v8a/librust_lib_flutterustmusic.so" build/android-arm64-contents.txt
          : > build/android-arm64-dex-strings.txt
          for dex in $(zipinfo -1 "$apk" 'classes*.dex'); do
            unzip -p "$apk" "$dex" | strings >> build/android-arm64-dex-strings.txt
          done
          grep -q 'org/rustls/platformverifier/CertificateVerifier' \
            build/android-arm64-dex-strings.txt
          unzip -p "$apk" lib/arm64-v8a/librust_lib_flutterustmusic.so \
            > build/librust_lib_flutterustmusic-arm64.so
          readelf -Ws build/librust_lib_flutterustmusic-arm64.so \
            > build/librust_lib_flutterustmusic-arm64-symbols.txt
          grep -q 'Java_dev_axiaobo_flutterustmusic_FuraApplication_initializeRustlsPlatformVerifier' \
            build/librust_lib_flutterustmusic-arm64-symbols.txt

      - name: Collect ARM64 APK
        working-directory: apps/flutter
        run: |
          mkdir -p build/test-packages
          cp build/app/outputs/flutter-apk/app-release.apk build/test-packages/flutterustmusic-android-arm64-development.apk

      - name: Build x64 emulator APK
        working-directory: apps/flutter
        run: flutter build apk --debug --target-platform android-x64

      - name: Collect Android artifacts
        working-directory: apps/flutter
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk build/test-packages/flutterustmusic-android-x64-debug.apk
          cp ../../docs/development/cross-platform-test-packages.md build/test-packages/README.md
          flutter --version > build/test-packages/FLUTTER_VERSION.txt
          rustc --version > build/test-packages/RUST_VERSION.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-android-development-${{ github.run_number }}
          path: apps/flutter/build/test-packages/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  linux-deb-build:
    name: Build Ubuntu 24.04 DEB
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Ubuntu build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils clang cmake dbus-x11 desktop-file-utils dpkg-dev file \
            g++ gstreamer1.0-plugins-base gstreamer1.0-plugins-good jq \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
            libgtk-3-dev libmpv-dev libsecret-1-dev libwebkit2gtk-4.1-dev \
            ninja-build patchelf pkg-config xauth xvfb

      - name: Install Rust baseline
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_BASELINE_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Verify MPRIS and media initialization
        working-directory: apps/flutter
        run: |
          dbus-run-session -- xvfb-run -a \
            flutter test integration_test/system_playback_service_test.dart -d linux
          dbus-run-session -- xvfb-run -a \
            flutter test integration_test/music_video_engine_test.dart -d linux

      - name: Verify offline WebKitGTK lifecycle
        working-directory: apps/flutter
        run: |
          dbus-run-session -- xvfb-run -a \
            flutter test integration_test/webview_all_linux_stability_test.dart -d linux

      - name: Build Ubuntu Linux Release bundle
        working-directory: apps/flutter
        run: flutter build linux --release

      - name: Build and inspect DEB
        run: |
          packaging/linux/build_deb.sh \
            apps/flutter/build/linux/x64/release/bundle \
            build/linux-packages/deb \
            "${{ github.run_number }}"
          cp docs/development/cross-platform-test-packages.md \
            build/linux-packages/deb/README.md

      - name: Upload DEB build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-linux-deb-${{ github.run_number }}
          path: build/linux-packages/deb/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  linux-rpm-build:
    name: Build Fedora 43 RPM
    needs: quality
    runs-on: ubuntu-24.04
    container:
      image: fedora:43
    timeout-minutes: 120

    steps:
      - name: Install Fedora build prerequisites
        run: |
          dnf install --assumeyes \
            binutils clang cmake curl desktop-file-utils file gcc-c++ git \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            gstreamer1-plugins-base gstreamer1-plugins-good gtk3-devel jq \
            libepoxy-devel libsecret-devel mpv-devel ninja-build \
            patchelf pkgconf-pkg-config rpm-build tar unzip webkit2gtk4.1-devel xz

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust baseline
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_BASELINE_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Build Fedora Linux Release bundle
        working-directory: apps/flutter
        run: flutter build linux --release

      - name: Build and inspect RPM
        run: |
          packaging/linux/build_rpm.sh \
            apps/flutter/build/linux/x64/release/bundle \
            build/linux-packages/rpm \
            "${{ github.run_number }}"
          cp docs/development/cross-platform-test-packages.md \
            build/linux-packages/rpm/README.md

      - name: Upload RPM build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-linux-rpm-${{ github.run_number }}
          path: build/linux-packages/rpm/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  linux-arch-build:
    name: Build Arch Linux package
    needs: quality
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    timeout-minutes: 120

    steps:
      - name: Install Arch build prerequisites
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            clang cmake curl dbus desktop-file-utils file git gst-plugins-base gst-plugins-good \
            gstreamer gtk3 jq libepoxy libsecret mpv ninja patchelf pkgconf \
            rustup sudo unzip webkit2gtk-4.1 xz

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust baseline
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_BASELINE_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Build Arch Linux Release bundle
        working-directory: apps/flutter
        run: flutter build linux --release

      - name: Build and inspect pacman package as non-root
        run: |
          useradd --create-home --user-group package-builder
          MAKEPKG_USER=package-builder packaging/linux/build_arch.sh \
            apps/flutter/build/linux/x64/release/bundle \
            build/linux-packages/arch \
            "${{ github.run_number }}"
          cp docs/development/cross-platform-test-packages.md \
            build/linux-packages/arch/README.md

      - name: Upload Arch build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-linux-arch-${{ github.run_number }}
          path: build/linux-packages/arch/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  linux-appimage-build:
    name: Build Ubuntu 24.04 AppImage
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils clang cmake curl desktop-file-utils file g++ \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good jq \
            libgirepository1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev libgtk-3-dev libmpv-dev librsvg2-dev \
            libsecret-1-dev libwebkit2gtk-4.1-dev ninja-build patchelf \
            pkg-config squashfs-tools xz-utils

      - name: Install Rust baseline
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_BASELINE_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Build AppImage baseline Release bundle
        working-directory: apps/flutter
        run: flutter build linux --release

      - name: Build and inspect AppImage
        run: |
          packaging/linux/build_appimage.sh \
            apps/flutter/build/linux/x64/release/bundle \
            build/linux-packages/appimage \
            "${{ github.run_number }}"
          cp docs/development/cross-platform-test-packages.md \
            build/linux-packages/appimage/README.md

      - name: Upload AppImage build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-linux-appimage-${{ github.run_number }}
          path: build/linux-packages/appimage/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  linux-deb-verify:
    name: Install-test Ubuntu 24.04 DEB
    needs: linux-deb-build
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    timeout-minutes: 45

    steps:
      - name: Install clean-room test harness
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            binutils ca-certificates dbus-x11 git gstreamer1.0-tools passwd \
            xauth xdotool xvfb

      - name: Check out verification scripts
        uses: actions/checkout@v6

      - name: Download DEB artifact
        uses: actions/download-artifact@v5
        with:
          name: flutterustmusic-linux-deb-${{ github.run_number }}
          path: artifacts/deb

      - name: Query, install, launch, reinstall, and remove DEB
        run: |
          deb=$(find artifacts/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -s "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          apt-get install --yes "$deb"
          useradd --create-home --user-group package-tester
          runuser -u package-tester -- env \
            FURA_VERIFY_HOME=/home/package-tester \
            packaging/linux/verify_installed_app.sh \
              /usr/bin/flutterustmusic /usr/lib/flutterustmusic native
          mkdir -p /home/package-tester/.config/flutterustmusic
          touch /home/package-tester/.config/flutterustmusic/preserve-on-uninstall
          apt-get install --yes --reinstall "$deb"
          apt-get remove --yes flutterustmusic
          test -f /home/package-tester/.config/flutterustmusic/preserve-on-uninstall
          test ! -e /usr/bin/flutterustmusic
          test ! -e /usr/lib/flutterustmusic

  linux-rpm-verify:
    name: Install-test Fedora 43 RPM
    needs: linux-rpm-build
    runs-on: ubuntu-24.04
    container:
      image: fedora:43
    timeout-minutes: 45

    steps:
      - name: Install clean-room test harness
        run: |
          dnf install --assumeyes \
            binutils ca-certificates dbus-daemon git shadow-utils xdotool \
            xorg-x11-server-Xvfb xorg-x11-xauth

      - name: Check out verification scripts
        uses: actions/checkout@v6

      - name: Download RPM artifact
        uses: actions/download-artifact@v5
        with:
          name: flutterustmusic-linux-rpm-${{ github.run_number }}
          path: artifacts/rpm

      - name: Query, install, launch, reinstall, and remove RPM
        run: |
          rpm_file=$(find artifacts/rpm -maxdepth 1 -type f -name '*.rpm' -print -quit)
          test -s "$rpm_file"
          rpm -qip "$rpm_file"
          rpm -qlp "$rpm_file"
          dnf install --assumeyes "$rpm_file"
          useradd --create-home --user-group package-tester
          runuser -u package-tester -- env \
            FURA_VERIFY_HOME=/home/package-tester \
            packaging/linux/verify_installed_app.sh \
              /usr/bin/flutterustmusic /usr/lib/flutterustmusic native
          mkdir -p /home/package-tester/.config/flutterustmusic
          touch /home/package-tester/.config/flutterustmusic/preserve-on-uninstall
          dnf reinstall --assumeyes "$rpm_file"
          dnf remove --assumeyes flutterustmusic
          test -f /home/package-tester/.config/flutterustmusic/preserve-on-uninstall
          test ! -e /usr/bin/flutterustmusic
          test ! -e /usr/lib/flutterustmusic

  linux-arch-verify:
    name: Install-test Arch package
    needs: linux-arch-build
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base
    timeout-minutes: 45

    steps:
      - name: Install clean-room test harness
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            binutils ca-certificates dbus git shadow xdotool xorg-server-xvfb xorg-xauth

      - name: Check out verification scripts
        uses: actions/checkout@v6

      - name: Download Arch artifact
        uses: actions/download-artifact@v5
        with:
          name: flutterustmusic-linux-arch-${{ github.run_number }}
          path: artifacts/arch

      - name: Query, install, launch, reinstall, and remove pacman package
        run: |
          package_file=$(find artifacts/arch -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)
          test -s "$package_file"
          pacman -Qip "$package_file"
          pacman -Qlp "$package_file"
          pacman -U --noconfirm "$package_file"
          useradd --create-home --user-group package-tester
          runuser -u package-tester -- env \
            FURA_VERIFY_HOME=/home/package-tester \
            packaging/linux/verify_installed_app.sh \
              /usr/bin/flutterustmusic /usr/lib/flutterustmusic native
          mkdir -p /home/package-tester/.config/flutterustmusic
          touch /home/package-tester/.config/flutterustmusic/preserve-on-uninstall
          pacman -U --noconfirm "$package_file"
          pacman -R --noconfirm flutterustmusic
          test -f /home/package-tester/.config/flutterustmusic/preserve-on-uninstall
          test ! -e /usr/bin/flutterustmusic
          test ! -e /usr/lib/flutterustmusic

  linux-appimage-verify:
    name: Extract-run AppImage (${{ matrix.name }})
    needs: linux-appimage-build
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
      options: --security-opt seccomp=unconfined
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: deb
          - name: Fedora 43
            image: fedora:43
            family: rpm

    steps:
      - name: Install declared AppImage base and test harness
        run: |
          if test "${{ matrix.family }}" = deb; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
              binutils bubblewrap ca-certificates dbus-x11 file fontconfig git \
              libegl1 libgl1 libgl1-mesa-dri passwd xauth xdg-dbus-proxy xdotool xvfb
          else
            dnf install --assumeyes \
              binutils bubblewrap ca-certificates dbus-daemon file fontconfig git \
              libglvnd-egl libglvnd-glx mesa-dri-drivers shadow-utils \
              xdg-dbus-proxy xdotool xorg-x11-server-Xvfb xorg-x11-xauth
          fi

      - name: Check out verification scripts
        uses: actions/checkout@v6

      - name: Download AppImage artifact
        uses: actions/download-artifact@v5
        with:
          name: flutterustmusic-linux-appimage-${{ github.run_number }}
          path: artifacts/appimage

      - name: Query, extract, audit, and launch AppImage
        run: |
          appimage=$(find artifacts/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -s "$appimage"
          chmod 0755 "$appimage"
          portable_directory=$(mktemp -d '/tmp/flutterustmusic AppImage XXXX')
          cp "$appimage" "$portable_directory/flutterustmusic.AppImage"
          mkdir "$portable_directory/extracted"
          (
            cd "$portable_directory/extracted"
            "$portable_directory/flutterustmusic.AppImage" --appimage-extract >/dev/null
          )
          appdir="$portable_directory/extracted/squashfs-root"
          packaging/linux/audit_appimage.sh "$appdir" "$portable_directory/audit"
          useradd --create-home --user-group package-tester
          chown -R package-tester:package-tester "$portable_directory"
          runuser -u package-tester -- env \
            FURA_VERIFY_HOME=/home/package-tester \
            packaging/linux/verify_installed_app.sh \
              "$appdir/AppRun" "$appdir/usr/lib/flutterustmusic" appimage

  linux-artifacts:
    name: Assemble verified Linux x64 artifacts
    needs:
      - linux-deb-verify
      - linux-rpm-verify
      - linux-arch-verify
      - linux-appimage-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download verified package artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: flutterustmusic-linux-*-${{ github.run_number }}
          path: build/linux-artifacts/source

      - name: Require and assemble all four formats
        run: |
          mkdir -p build/linux-artifacts/final
          for pattern in '*.deb' '*.rpm' '*.pkg.tar.zst' '*.AppImage'; do
            mapfile -t matches < <(find build/linux-artifacts/source -type f -name "$pattern")
            test "${#matches[@]}" -eq 1
            test -s "${matches[0]}"
            cp "${matches[0]}" build/linux-artifacts/final/
          done
          cp docs/development/cross-platform-test-packages.md \
            build/linux-artifacts/final/README.md
          printf 'source_commit=%s\nworkflow_run=%s\n' \
            "${{ github.sha }}" "${{ github.run_id }}" \
            > build/linux-artifacts/final/BUILD-SOURCE.txt
          (
            cd build/linux-artifacts/final
            sha256sum -- *.deb *.rpm *.pkg.tar.zst *.AppImage > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload verified Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-linux-x64-development-${{ github.run_number }}
          path: build/linux-artifacts/final/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  windows:
    name: Windows x64 development bundle
    needs: quality
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust for Cargokit
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Build Windows Release bundle
        working-directory: apps/flutter
        run: flutter build windows --release

      - name: Package Windows bundle
        working-directory: apps/flutter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/test-packages | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/test-packages/flutterustmusic-windows-x64-development.zip
          Copy-Item ../../docs/development/cross-platform-test-packages.md build/test-packages/README.md
          flutter --version | Out-File -Encoding utf8 build/test-packages/FLUTTER_VERSION.txt
          rustc --version | Out-File -Encoding utf8 build/test-packages/RUST_VERSION.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-windows-x64-development-${{ github.run_number }}
          path: apps/flutter/build/test-packages/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  macos:
    name: macOS development app
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust for Cargokit
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Build macOS Release app
        working-directory: apps/flutter
        run: flutter build macos --release

      - name: Package macOS app
        working-directory: apps/flutter
        run: |
          mkdir -p build/test-packages
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/flutterustmusic.app build/test-packages/flutterustmusic-macos-development.zip
          cp ../../docs/development/cross-platform-test-packages.md build/test-packages/README.md
          lipo -archs build/macos/Build/Products/Release/flutterustmusic.app/Contents/MacOS/flutterustmusic > build/test-packages/MACOS_ARCHITECTURES.txt
          flutter --version > build/test-packages/FLUTTER_VERSION.txt
          rustc --version > build/test-packages/RUST_VERSION.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-macos-development-${{ github.run_number }}
          path: apps/flutter/build/test-packages/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  ios-simulator:
    name: iOS Simulator Debug app
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust for Cargokit
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Build iOS Simulator app
        working-directory: apps/flutter
        run: flutter build ios --simulator --debug

      - name: Package iOS Simulator app
        working-directory: apps/flutter
        run: |
          mkdir -p build/test-packages
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/test-packages/flutterustmusic-ios-simulator-development.zip
          cp ../../docs/development/cross-platform-test-packages.md build/test-packages/README.md
          lipo -archs build/ios/iphonesimulator/Runner.app/Runner > build/test-packages/IOS_SIMULATOR_ARCHITECTURES.txt
          flutter --version > build/test-packages/FLUTTER_VERSION.txt
          rustc --version > build/test-packages/RUST_VERSION.txt

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterustmusic-ios-simulator-development-${{ github.run_number }}
          path: apps/flutter/build/test-packages/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
