[workspace]
members = [
    "bridges/flutter",
    "crates/music-domain",
    "crates/provider-api",
    "crates/qqmusic-client",
    "crates/provider-qqmusic",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Axiaobo7788/flutterustmusic"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
