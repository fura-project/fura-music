[package]
name = "qqmusic-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
flate2 = "1.1.9"
futures-util = "0.3.34"
getrandom = "0.4.3"
md-5 = "0.10.6"
quick-xml = "0.42.0"
reqwest = { version = "0.13.4", default-features = false, features = ["query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
url = "2.5.7"
zeroize = "1.9.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "test-util"] }

[lints]
workspace = true
