[package]
name = "qqmusic-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flate2 = "1.1.9"
getrandom = "0.4.3"
md-5 = "0.10.6"
quick-xml = "0.42.0"
reqwest = { version = "0.13.4", default-features = false, features = ["query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
url = "2.5.7"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "test-util"] }

[lints]
workspace = true
