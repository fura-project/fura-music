[package]
name = "netease-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
base64 = "0.22.1"
getrandom = "0.4.3"
flate2 = "1.1.9"
md-5 = "0.10.6"
num-bigint = "0.4.6"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.7"

qrcode = { version = "0.14.1", default-features = false }
png = "0.18.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }

[lints]
workspace = true
