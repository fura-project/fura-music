// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.rust_lib_flutterustmusic'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.rust_lib_flutterustmusic'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 19
    }
}

def rustupExecutable = System.getenv('PATH')
        ?.split(File.pathSeparator)
        ?.collect { new File(it, 'rustup') }
        ?.find { it.isFile() && it.canExecute() }
def useLinuxSystemCargo = org.apache.tools.ant.taskdefs.condition.Os.isFamily(
        org.apache.tools.ant.taskdefs.condition.Os.FAMILY_UNIX
    ) && !org.apache.tools.ant.taskdefs.condition.Os.isFamily(
        org.apache.tools.ant.taskdefs.condition.Os.FAMILY_MAC
    ) && rustupExecutable == null

if (useLinuxSystemCargo) {
    // TD-001: keep the Arch/system-Rust exception local to the Android build.
    apply from: "system_cargo.gradle"
} else {
    apply from: "../cargokit/gradle/plugin.gradle"
    cargokit {
        manifestDir = "../../../../bridges/flutter"
        libname = "rust_lib_flutterustmusic"
    }
}
