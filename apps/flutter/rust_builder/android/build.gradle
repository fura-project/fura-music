// The Android Gradle Plugin builds the native code with the Android NDK.
import groovy.json.JsonSlurper

group 'com.flutter_rust_bridge.rust_lib_flutterustmusic'
version '1.0'

def bridgeManifest = new File(project.projectDir, '../../../../bridges/flutter/Cargo.toml')
def rustlsAndroidMetadata = new JsonSlurper().parseText(providers.exec {
    workingDir project.projectDir
    commandLine 'cargo', 'metadata', '--format-version', '1', '--filter-platform',
            'aarch64-linux-android', '--manifest-path', bridgeManifest.absolutePath
}.standardOutput.asText.get())
def rustlsAndroidPackage = rustlsAndroidMetadata.packages.find {
    it.name == 'rustls-platform-verifier-android'
}
if (rustlsAndroidPackage == null) {
    throw new GradleException('Cargo metadata did not contain rustls-platform-verifier-android')
}
def rustlsAndroidManifest = file(rustlsAndroidPackage.manifest_path)
def rustlsAndroidMavenRepository = new File(rustlsAndroidManifest.parentFile, 'maven')

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url rustlsAndroidMavenRepository
            metadataSources.artifact()
        }
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.rust_lib_flutterustmusic'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 19
        consumerProguardFiles 'consumer-rules.pro'
    }
}

dependencies {
    implementation "rustls:rustls-platform-verifier:${rustlsAndroidPackage.version}"
}

def rustupExecutable = System.getenv('PATH')
        ?.split(File.pathSeparator)
        ?.collect { new File(it, 'rustup') }
        ?.find { it.isFile() && it.canExecute() }
def useLinuxSystemCargo = org.apache.tools.ant.taskdefs.condition.Os.isFamily(
        org.apache.tools.ant.taskdefs.condition.Os.FAMILY_UNIX
    ) && !org.apache.tools.ant.taskdefs.condition.Os.isFamily(
        org.apache.tools.ant.taskdefs.condition.Os.FAMILY_MAC
    ) && rustupExecutable == null

if (useLinuxSystemCargo) {
    // TD-001: keep the Arch/system-Rust exception local to the Android build.
    apply from: "system_cargo.gradle"
} else {
    apply from: "../cargokit/gradle/plugin.gradle"
    cargokit {
        manifestDir = "../../../../bridges/flutter"
        libname = "rust_lib_flutterustmusic"
    }
}
